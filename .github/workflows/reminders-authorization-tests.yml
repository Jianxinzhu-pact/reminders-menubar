name: Reminders authorization XCTest

on:
  push:
    branches:
      - verification/reminders-authorization-20260828
  workflow_dispatch:

jobs:
  authorization-tests:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: Run task-specific XCTest suite
        env:
          NSUnbufferedIO: "YES"
        run: |
          set -o pipefail
          xcodebuild \
            -project reminders-menubar.xcodeproj \
            -scheme "Reminders MenuBar" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:reminders-menubarTests/RemindersAuthorizationCoordinatorTests \
            -resultBundlePath "$RUNNER_TEMP/RemindersAuthorizationTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Upload complete test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reminders-authorization-test-diagnostics
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/RemindersAuthorizationTests.xcresult
          if-no-files-found: warn
