name: Launch at Login XCTest

on:
  push:
    branches:
      - verification/launch-at-login-20260828
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: Run full XCTest suite
        env:
          NSUnbufferedIO: "YES"
        run: |
          set -o pipefail
          xcodebuild \
            -project reminders-menubar.xcodeproj \
            -scheme "Reminders MenuBar" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -resultBundlePath "$RUNNER_TEMP/LaunchAtLoginTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Build App Store configuration
        run: |
          xcodebuild \
            -project reminders-menubar.xcodeproj \
            -scheme "Reminders MenuBar AppStore" \
            -configuration Debug-AppStore \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-at-login-test-diagnostics
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/LaunchAtLoginTests.xcresult
          if-no-files-found: warn
